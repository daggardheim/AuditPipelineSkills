# Agent Permissions — runbooks domain
# Generated by audit-pipeline-setup. The orchestrator reads this file
# to set tool restrictions and file scope per stage.
#
# To fix a permission error: edit the relevant stage below and restart.
# {document} is replaced by the orchestrator with the actual filename.

agents:
  creator:
    cli: claude
    cli_command: 'claude -p "{prompt}" --output-format json --max-turns 10'
  auditor:
    cli: codex
    cli_command: 'codex exec "{prompt}"'

stages:
  S1:
    role: creator
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
    allowed_read:
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/completed/example-runbook.md"
      - "src/operations/**/*.md"
    allowed_write:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"

  S2:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  S3:
    role: creator
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/completed/example-runbook.md"
      - "src/operations/**/*.md"
    allowed_write:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"

  S4:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  S5:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
    allowed_write:
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/index.md"
