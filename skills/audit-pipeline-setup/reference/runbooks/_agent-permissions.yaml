# Agent Permissions — runbooks domain
# Generated by audit-pipeline-setup. The orchestrator reads this file
# to set tool restrictions and file scope per stage.
#
# To fix a permission error: edit the relevant stage below and restart.
# {document} is replaced by the orchestrator with the actual filename.

agents:
  creator:
    cli: claude
    cli_command: 'claude -p "{prompt}" --output-format json --max-turns 10'
    role_model: { engine: claude, tier: opus }
  auditor:
    cli: codex
    cli_command: 'codex exec "{prompt}"'
    role_model: { engine: codex, tier: "" }
  # Recorder: Mode A/C only. Persists structured stage results to the reporting
  # artifacts. Write-scoped to tools/audit/** and the index — NEVER the document.
  recorder:
    cli: claude
    cli_command: 'claude -p "{prompt}" --output-format json --max-turns 3'
    role_model: { engine: claude, tier: haiku }

stages:
  S1:
    role: creator
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
    allowed_read:
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/completed/example-runbook.md"
      - "src/operations/**/*.md"
    allowed_write:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"

  S2:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  S3:
    role: creator
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/completed/example-runbook.md"
      - "src/operations/**/*.md"
    allowed_write:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"

  S4:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  S5:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
    allowed_write:
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/index.md"

  # ── Retroactive governance pass ──────────────────────────────

  S6:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  S7:
    role: creator
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/completed/example-runbook.md"
      - "src/operations/**/*.md"
    allowed_write:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"

  S8:
    role: auditor
    sandbox: workspace-write
    allowed_tools: [Read, Glob]
    allowed_read:
      - "runbooks/drafts/{document}"
      - "runbooks/index.md"
      - "runbooks/shared/_template.md"
      - "runbooks/shared/_open-questions.md"
      - "runbooks/shared/_example-prompt.md"
    allowed_write: []

  # ── Reporting recorder (Mode A/C only) ───────────────────────
  REC:
    role: recorder
    sandbox: workspace-write
    allowed_tools: [Read, Write, Edit, Glob]
    allowed_read:
      - "runbooks/index.md"
      - "tools/audit/loop-state.json"
      - "tools/audit/audit-log.jsonl"
    allowed_write:
      - "tools/audit/audit-log.jsonl"
      - "tools/audit/loop-state.json"
      - "runbooks/index.md"
